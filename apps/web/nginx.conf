server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # DNS interno de Docker (para resolver el servicio "api" en runtime)
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api http://api:4000;

    # --- API: proxy al backend (mismo origen que la web) ---
    location /api/ {
        proxy_pass $api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # --- WebSocket (Socket.IO) con upgrade ---
    location /socket.io/ {
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    # No cachear el service worker ni el HTML de entrada
    location = /sw.js        { add_header Cache-Control "no-cache"; try_files $uri =404; }
    location = /index.html   { add_header Cache-Control "no-cache"; try_files $uri =404; }

    # Assets con hash: cache larga
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA: cualquier otra ruta cae en index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
