# =====================================================================
# nginx reverse proxy para Control Flota  ->  contenedor Docker web
# Colocar en el VPS (91.99.175.78) como:
#   /etc/nginx/sites-available/flota.simarp.net.conf
# y enlazar:
#   sudo ln -s /etc/nginx/sites-available/flota.simarp.net.conf /etc/nginx/sites-enabled/
# Luego:  sudo nginx -t && sudo systemctl reload nginx
# y para el HTTPS:  sudo certbot --nginx -d flota.simarp.net
# =====================================================================

# Necesario para WebSocket (Socket.IO). Si tu nginx ya define este map en
# otro archivo, ELIMINA este bloque para evitar el error "duplicate map".
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name flota.simarp.net;

    # (certbot --nginx añadirá aquí la config SSL y el redirect a 443)

    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:8095;
        proxy_http_version 1.1;

        # WebSocket / Socket.IO
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 3600s;   # conexiones WebSocket largas
        proxy_buffering off;
    }
}
